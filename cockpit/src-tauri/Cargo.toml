[package]
name = "liquidator-cockpit"
version = "2.0.0"
description = "Local desktop operator cockpit for Aave liquidator"
authors = ["you"]
edition = "2021"

[lib]
name = "liquidator_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
